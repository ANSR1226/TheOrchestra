name: Update LeetCode Streak

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit changes back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update LeetCode Stats Card
        uses: DenverCoder1/github-readme-leetcode-stats@main
        with:
          USERNAME: "SwayambhubaSahu"

      - name: Commit and push updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update leetcode streak"
